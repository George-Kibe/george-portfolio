name: CI

on:
  push:
    branches: [master, main]
  pull_request:

# Two independent apps in one repo: they share no code and no lockfile, so they
# are built and tested separately rather than in one job.
jobs:
  dev-portfolio:
    name: Dev portfolio (root)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  video-portfolio:
    name: Video portfolio
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: george-video-portfolio
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ../.bun-version
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run test
      - run: bun run build
